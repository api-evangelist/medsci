description: MedSci (梅斯医学 / MedSci Healthcare Holdings Limited, HKEX 2415) is a leading
  online professional physician platform in China, founded in 2012 and headquartered
  in Shanghai. It connects roughly 2.9 million registered physician users with pharmaceutical
  and medical device companies through big data and AI, offering physician platform
  solutions (medical knowledge, clinical study assistance), precision omni-channel
  marketing, real-world study (RWS) solutions, and the MedSci xAI medical AI agent.
  Surfaced as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network. No public third-party developer API program, OpenAPI/SDK, or developer
  portal was found; the primary web host is geo-restricted and unreachable for HTTP
  probing.
